    <script>
      (function () {
        try {
          var raw = localStorage.getItem('rms_user_appearance_cache_v1');
          var prefs = raw ? JSON.parse(raw) : null;
          var mode = (prefs && prefs.themeMode) || 'light';
          var sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = mode === 'dark' || (mode === 'system' && sysDark);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-resolved-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-resolved-theme', 'light');
          }
          if (prefs && prefs.accentTheme) {
            document.documentElement.setAttribute('data-accent-theme', prefs.accentTheme);
          }
          if (prefs && prefs.fontFamily) {
            document.documentElement.style.setProperty(
              '--rms-font-family',
              "'" + prefs.fontFamily + "', -apple-system, BlinkMacSystemFont, sans-serif"
            );
          }
        } catch (e) {}
      })();
    </script>
  </head>
